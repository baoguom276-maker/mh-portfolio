    - data:
        code: "import json\nimport re\n\ndef main(llm_text: str) -> dict:\n    prompt\
          \ = \"\"\n    error = \"\"\n    \n    try:\n        # 尝试解析JSON\n       \
          \ data = json.loads(llm_text)\n        if isinstance(data, dict):\n    \
          \        for key in ['prompt', '生图Prompt', 'image_prompt', 'result']:\n\
          \                if key in data:\n                    prompt = data[key]\n\
          \                    return {\"prompt\": prompt, \"error\": error}\n   \
          \ except:\n        pass\n    \n    # 如果不是JSON，提取包含\"Japanese Anime Style\"\
          的行\n    lines = llm_text.split('\\n')\n    for line in lines:\n        if\
          \ 'Japanese Anime Style' in line or '生图Prompt' in line:\n            if\
          \ ':' in line:\n                prompt = line.split(':', 1)[1].strip()\n\
          \            else:\n                prompt = line.strip()\n            return\
          \ {\"prompt\": prompt, \"error\": error}\n    \n    # 兜底：清理markdown标记后返回\n\
          \    cleaned = re.sub(r'```[\\w]*\\n?', '', llm_text)\n    cleaned = cleaned.replace('```',\
          \ '').strip()\n    \n    if len(cleaned) > 10:\n        prompt = cleaned\n\
          \    else:\n        prompt = \"Japanese Anime Style, 2D, a beautiful girl\
          \ with long black hair, white background, full body, anime character\"\n\
          \        error = \"无法从LLM输出中提取有效prompt，使用默认prompt\"\n    \n    return {\"\
          prompt\": prompt, \"error\": error}"
