          )\n    \n    # 生成模拟视频URL（带参数标记，方便调试）\n    mock_url = f\"https://mock-video.example.com/{mock_id}_{resolution}.mp4?prompt={prompt[:30]}\"\
          \n    \n    # 返回与真实API兼容的JSON字符串格式\n    response = {\n        \"url\": mock_url,\n\
          \        \"task_id\": f\"mock_task_{mock_id}\",\n        \"resolution\"\
          : resolution,\n        \"duration\": 5,\n        \"prompt\": prompt,\n \
          \       \"image_url\": image_url,\n        \"status\": \"success\"\n   \
          \ }\n    \n    return {\n        \"text\": json.dumps(response, ensure_ascii=False)\n\
          \    }"
