          \ = \"16:9\") -> dict:\n    # 清理markdown标记\n    cleaned = csv_content.replace('```csv',\
          \ '').replace('```', '').strip()\n    \n    try:\n        reader = csv.DictReader(io.StringIO(cleaned))\n\
          \        rows = list(reader)\n    except Exception as e:\n        return\
          \ {\n            \"prompts\": [],\n            \"count\": 0,\n         \
          \   \"errors\": [f\"CSV解析失败: {str(e)}\"]\n        }\n    \n    prompts =\
