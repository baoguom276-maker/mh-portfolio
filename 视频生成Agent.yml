          \    \n    # 模拟不同比例\n    ratio_map = {\n        \"16:9\": \"1280x720\",\n\
          \        \"9:16\": \"720x1280\", \n        \"1:1\": \"960x960\",\n     \
          \   \"4:3\": \"960x720\",\n        \"3:4\": \"720x960\",\n        \"21:9\"\
